<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adán Vivas · Talk to me</title>
<style>
  :root { --paper: #e8e7ee; --ink: #13131a; --out: cubic-bezier(.23, 1, .32, 1); --move: cubic-bezier(.77, 0, .175, 1); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); overflow: hidden; }
  body { font: 500 14px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }

  /* Cursor pill: the link itself, carried under the pointer */
  #pill {
    position: fixed; left: 0; top: 0; z-index: 3;
    display: inline-flex; align-items: center; height: 36px; padding: 0 16px;
    border-radius: 999px; border: 1px solid transparent; background: var(--ink); color: var(--paper);
    text-decoration: none; white-space: nowrap; line-height: 1;
    box-shadow: 0 0 0 1.5px var(--paper), 0 6px 18px rgba(0, 0, 0, .22);
    translate: calc(var(--x, 50vw) - 50%) calc(var(--y, var(--dock, 70vh)) - 50%);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #pill.press, #pill:active { scale: .96; }
  #pill.away { opacity: 0; scale: .96; pointer-events: none; }
  #pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* Era cursor for the timeline */
  #hand { position: fixed; left: 0; top: 0; z-index: 4; width: 48px; height: 48px; pointer-events: none; opacity: 0; scale: .95;
    translate: calc(var(--x, 0px) - 24px) calc(var(--y, 0px) - 12px); transform-origin: 24px 12px; }
  #hand.on { opacity: 1; scale: 1; }
  #hand.on.press { scale: .96; }

  /* Timeline */
  #timeline {
    position: fixed; left: 50%; bottom: 16px; translate: -50% 0; z-index: 2;
    width: min(520px, calc(100vw - 24px)); padding: 12px 14px 10px;
    border-radius: 16px; border: 1px solid transparent; background: var(--paper); color: var(--ink);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent), 0 1px 2px rgba(0, 0, 0, .08), 0 10px 28px rgba(0, 0, 0, .16);
  }
  .cap { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; }
  #cap-era { font-weight: 650; white-space: nowrap; }
  #cap-name { opacity: .7; min-width: 0; overflow-wrap: anywhere; }
  .stops { position: relative; display: flex; flex-wrap: wrap; margin-top: 2px; }
  .stop {
    position: relative; flex: 1 1 0; min-width: 0; height: 44px; padding: 0; border: 0; border-radius: 8px; background: none; color: inherit;
    display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
  }
  .stop::before { content: ""; width: 2px; height: calc(10px + 12px * var(--g, 0)); border-radius: 1px; background: currentColor; opacity: calc(.55 + .45 * var(--g, 0)); }
  /* Plausible futures: a line like the others. Once selected, the line becomes the shuffle icon. */
  .stop svg { position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; color: var(--paper); opacity: 0; scale: .25; filter: blur(4px); }
  .stop.fut[aria-checked="true"] svg { opacity: 1; scale: 1; filter: none; }
  .stop[aria-checked="true"]::before { opacity: 0; }
  .stop:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  #thumb { position: absolute; left: 0; top: 0; width: 6px; height: 24px; border-radius: 3px; background: currentColor; pointer-events: none;
    translate: calc(var(--cx, 0px) - 50%) calc(var(--cy, 22px) - 50%); }
  #thumb.fut { width: 28px; height: 28px; border-radius: 8px; }
  .ends { display: flex; justify-content: space-between; gap: 12px; margin-top: -4px; font-size: 11px; opacity: .7; }
  /* Narrow screens: a vertical rail on the right, with the caption riding beside the marker */
  @media (max-width: 599px) {
    #timeline { left: auto; right: 10px; bottom: auto; top: 50%; translate: 0 -50%; width: 52px; padding: 6px 4px; }
    .stops { flex-direction: column; flex-wrap: nowrap; margin: 0; }
    .stop { flex: none; width: 44px; height: clamp(24px, calc((100dvh - 150px) / 14), 34px); }
    .stop::before { width: calc(10px + 12px * var(--g, 0)); height: 2px; }
    #thumb { width: 24px; height: 6px; }
    .ends { display: none; }
    .cap { position: absolute; right: calc(100% + 8px); top: 6px; translate: 0 calc(var(--cy, 0px) - 50%); min-height: 0;
      flex-direction: column; align-items: flex-end; gap: 2px; padding: 7px 10px; border-radius: 10px; border: 1px solid transparent; background: var(--paper); white-space: nowrap;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent), 0 6px 18px rgba(0, 0, 0, .16); }
    #cap-name { font-size: 12px; }
  }

  @media (hover: hover) and (pointer: fine) {
    html, body, #c, #pill, #timeline, .stop { cursor: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #pill { transition: translate 260ms var(--out), scale 150ms var(--out), opacity 100ms var(--out); }
    #pill.follow { transition: scale 150ms var(--out), opacity 100ms var(--out); }
    #hand { transition: opacity 80ms var(--out), scale 80ms var(--out); }
    #hand.on { transition: opacity 140ms var(--out), scale 140ms var(--out); }
    #hand.swap { animation: swap 160ms var(--out); }
    #thumb { transition: translate 240ms var(--move), width 200ms var(--out), height 200ms var(--out), border-radius 200ms var(--out); }
    #thumb.jump { transition: none; }
    .stop::before { transition: height 140ms var(--out), width 140ms var(--out); }
    .stop svg { transition: rotate 280ms var(--out), opacity 300ms cubic-bezier(.2, 0, 0, 1), scale 300ms cubic-bezier(.2, 0, 0, 1), filter 300ms cubic-bezier(.2, 0, 0, 1); }
    .stop.fut[aria-checked="true"]:active svg { scale: .92; }
    .cap { transition: translate 240ms var(--move); }
    .cap.pop > span { animation: pop 200ms var(--out) both; }
    .cap.pop > #cap-name { animation-delay: 40ms; }
    @keyframes pop { from { opacity: 0; translate: 0 5px; filter: blur(2px); } }
    @keyframes swap { from { opacity: 0; scale: .9; filter: blur(2px); } }
  }
  @media (prefers-reduced-motion: reduce) { #pill, #hand { transition: opacity 120ms linear; } }
  noscript img { position: fixed; bottom: 0; left: 50%; height: 100%; transform: translateX(-50%); }
</style>
</head>

    { label: 'Japan',             name: 'Woodblock print',        paper: '#ebe3cc', ink: '#12204a' },
    { label: 'Byzantium',         name: 'Gold mosaic',            paper: '#1d1408', ink: '#f1cf7a' },
    { label: 'Middle Ages',       name: 'Illuminated manuscript', paper: '#ece0c2', ink: '#1a2358' },
    { label: '1800s',             name: 'Oil painting',           paper: '#1b2016', ink: '#ecdfc0' },
    { label: '1950s',             name: 'Binary code',            paper: '#efeadb', ink: '#161a2e' },
    { label: '2000s',             name: 'Pixel art',              paper: '#eaf4ff', ink: '#0f2a4a' },

  // The four scenarios of Arup's "2050 Scenarios: Four Plausible Futures"
  const FUTURES = [

    { name: 'Greentocracy',       paper: '#06110b', ink: '#7df0ae' },
    { name: 'Humans Inc.',        paper: '#1a0b2e', ink: '#ffd9f2' },

  const $ = id => document.getElementById(id);

    float seg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0., 1.); return length(pa - ba * h); }
    void main(){

      float n = (texture2D(uPrev, uv + vec2(px.x, 0.)).r + texture2D(uPrev, uv - vec2(px.x, 0.)).r + texture2D(uPrev, uv + vec2(0., px.y)).r + texture2D(uPrev, uv - vec2(0., px.y)).r) * .25;

      gl_FragColor = vec4(vec3(clamp(max(v, stamp), 0., 1.)), 1.);

  // Shared by every era: the photo with only the irises moving, plus tone, mask, edge and noise helpers.
  const HEAD = `
    precision highp float;
    uniform sampler2D uGray, uColor, uSmooth, uOil, uDepth, uTrail;
    uniform vec2 uRes, uMouse, uGaze; uniform vec4 uRect;
    uniform float uK, uD, uSigma, uTime, uMix;

    const float ASP = 0.63629;
    float B2(vec2 a){ a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
    float B4(vec2 a){ return B2(.5 * a) * .25 + B2(a); }
    float B8(vec2 a){ return B4(.5 * a) * .25 + B2(a); }
    float hash(vec2 p){ p = fract(p * vec2(.1031, .1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }
    float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }
    float field(vec2 c){
      float t = texture2D(uTrail, vec2(c.x, uRes.y - c.y) / uRes).r;
      vec2 d = c - uMouse;
      return max(t * .9, exp(-dot(d, d) / (2. * uSigma * uSigma)));

    // Screen px -> image uv. The head never moves. Only the irises slide inside the eyes, toward the cursor.
    vec3 warp(vec2 c){
      vec2 uv = (c - uRect.xy) / uRect.zw;
      vec2 e1 = (uv - vec2(.3685, .3173)) / vec2(.021, .0125), e2 = (uv - vec2(.5742, .2958)) / vec2(.021, .0125);
      float k = (1. - smoothstep(.65, 1.7, length(e1))) + (1. - smoothstep(.65, 1.7, length(e2)));
      vec2 st = uv - uGaze * vec2(.013, .0042) * k;
      float e = step(0., uv.x) * step(uv.x, 1.) * step(0., uv.y) * step(uv.y, 1.);
      float cut = .03 + .15 * pow(smoothstep(.52, 1., uv.y), 1.6) + (vnoise(vec2(uv.y * 9., 3.)) - .5) * .03;   // the bust tapers, so the crop reads as a shape, not a straight edge

      return vec3(clamp(st, 0., 1.), e);
    }
    float grayW(vec3 w){ float l = texture2D(uGray, w.xy).r; return mix(1., pow(clamp((l - .02) / .90, 0., 1.), 1.25), w.z); }
    float gray(vec2 c){ return grayW(warp(c)); }
    float maskW(vec3 w){ return texture2D(uDepth, w.xy).g * w.z; }
    float sm(vec3 w){ return dot(texture2D(uSmooth, w.xy).rgb, vec3(.3, .59, .11)); }
    bool cloth(vec3 w){ return w.y > .60 - .24 * abs(w.x - .52); }
    float pl(vec2 c){ vec3 w = warp(c); return mix(1.05, sm(w), smoothstep(.3, .7, maskW(w))); }
    float edges(vec2 p, float r){ return length(vec2(pl(p + vec2(r, 0.)) - pl(p - vec2(r, 0.)), pl(p + vec2(0., r)) - pl(p - vec2(0., r)))); }
    float contour(vec3 w){ return (1. - smoothstep(0., .2, abs(texture2D(uDepth, w.xy).g - .5))) * step(.5, w.z); }
    vec3 voro(vec2 x){
      vec2 n = floor(x), f = fract(x); float f1 = 8., f2 = 8.; vec2 best = vec2(0.);
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
        vec2 g = vec2(float(i), float(j)); vec2 o = vec2(hash(n + g), hash(n + g + 19.7));
        float d = length(g + o - f);
        if (d < f1) { f2 = f1; f1 = d; best = n + g + o; } else if (d < f2) f2 = d;

      return vec3(best, f2 - f1);
    }
    float cracks(vec2 x){ return voro(x).z; }
    // Cells that split 4 -> 2 -> 1 where the cursor is and has been.
    void quad(vec2 p, float base, out vec2 c, out vec2 id, out float s, out float f, out float level){
      s = base * 4.; id = floor(p / s); c = (id + .5) * s; level = 0.;
      f = field(c) + (hash(id) - .5) * .10;
      if (f > .14) {
        s = base * 2.; id = floor(p / s); c = (id + .5) * s; level = 1.;
        f = field(c) + (hash(id + 17.) - .5) * .16;
        if (f > .52) { s = base; id = floor(p / s); c = (id + .5) * s; f = field(c); level = 2.; }

    }
    // Hand-set tesserae: cell id, position inside the tile, tile center.
    void tiles(vec2 p, float s, out vec2 id, out vec2 fr, out vec2 c){
      vec2 pw = p + (vec2(vnoise(p / (42. * uD)), vnoise(p / (42. * uD) + 7.3)) - .5) * 9. * uD;
      pw.x += hash(vec2(floor(pw.y / s), 3.)) * s;
      id = floor(pw / s); fr = fract(pw / s); c = p + (.5 - fr) * s;

  `;
  const TAIL = `
    void main(){

  const STYLES = [
    // 0 Beginning of time. Drifting dust that gathers into a face where the cursor is.
    `vec3 style(vec2 p){

      vec3 col = vec3(.016, .02, .043);
      float n1 = vnoise(p / (230. * uD) + uTime * .012), n2 = vnoise(p / (95. * uD) - uTime * .016 + 4.);
      col += vec3(.11, .04, .17) * n1 * n1 * .7 + vec3(.02, .07, .15) * n2 * n2 * .5;
      for (int i = 0; i < 3; i++) {
        float fi = float(i); float s = (i == 0 ? 3. : (i == 1 ? 6. : 13.)) * uD;
        vec2 id = floor(p / s) + fi * 57.;
        vec2 pos = (floor(p / s) + .25 + .5 * vec2(hash(id + 1.3), hash(id + 2.7))) * s;
        vec2 fl = vec2(vnoise(pos / (80. * uD) + vec2(uTime * .06, fi)), vnoise(pos / (80. * uD) + vec2(5.2 + fi, uTime * .06))) - .5;
        vec3 w = warp(pos + fl * mix(90., 4., gather) * uD);
        float l = texture2D(uGray, w.xy).r;
        float b = maskW(w) * (.07 + .93 * l * l) * mix(.5, 1., gather);
        float on = step(hash(id), max(b, i == 2 ? .05 : .012));
        float tw = .62 + .38 * sin(uTime * (1. + hash(id + 5.) * 3.) + hash(id) * 40.);

    // 1 Stone Age. A petroglyph panel: the sitter reduced to a pecked figure with a rayed head, among spirals, hands and a snake. The cursor is firelight.
    `float handprint(vec2 q){
      float d = length(q * vec2(1., .9) - vec2(0., .25)) - .30;
      d = min(d, capsule(q, vec2(-.20, 0.), vec2(-.34, -.55)) - .075);
      d = min(d, capsule(q, vec2(-.07, -.05), vec2(-.10, -.75)) - .08);
      d = min(d, capsule(q, vec2(.07, -.05), vec2(.10, -.72)) - .08);
      d = min(d, capsule(q, vec2(.20, .02), vec2(.32, -.50)) - .07);
      return min(d, capsule(q, vec2(-.26, .25), vec2(-.55, .05)) - .08);
    }
    vec3 style(vec2 p){
      float U = uRect.z;
      float rk = vnoise(p / (140. * uD)) * .5 + vnoise(p / (30. * uD)) * .3 + vnoise(p / (5. * uD)) * .2;
      float patch = vnoise(p / (260. * uD) + 3.) * .6 + vnoise(p / (70. * uD)) * .4;
      vec3 rock = mix(vec3(.23, .09, .055), vec3(.50, .24, .12), smoothstep(.35, .75, patch)) * (.72 + .55 * rk);
      float cr = abs(p.x - (uRect.x + 1.03 * U + sin(p.y / (90. * uD)) * 14. * uD + vnoise(vec2(p.y / (20. * uD), 1.)) * 12. * uD));
      rock *= 1. - .75 * (1. - smoothstep(0., 2.5 * uD, cr));
      vec3 w = warp(p); float body = smoothstep(.4, .6, maskW(w)), b = 5. * uD;
      float tone = (pl(p + vec2(b, 0.)) + pl(p - vec2(b, 0.)) + pl(p + vec2(0., b)) + pl(p - vec2(0., b)) + pl(p)) / 5.;
      float mark = body * smoothstep(.25, .31, tone);
      if (cloth(w) && tone < .3) mark = body * step(.5, fract((w.y + abs(fract(w.x * 7.) - .5) * .06) * 20.));
      vec2 dh = p - (uRect.xy + uRect.zw * vec2(.52, .30)); float rh = length(dh) / U;
      mark = max(mark, step(.47, rh) * step(rh, .66) * step(.58, fract(atan(dh.y, dh.x) * 24. / 6.2832)) * step(dh.y, .10 * U) * (1. - body));
      vec2 da = p - (uRect.xy + uRect.zw * vec2(1.30, .27)); float ra = length(da), R = .19 * U;
      mark = max(mark, step(ra, R) * step(.5, fract(ra / (R / 4.5) - atan(da.y, da.x) / 6.2832)));
      vec2 db = p - (uRect.xy + uRect.zw * vec2(-.32, .22)); float rb = length(db) / U;
      mark = max(mark, step(rb, .035) + step(.065, rb) * step(rb, .085) + step(.115, rb) * step(rb, .135));
      mark = max(mark, step(handprint((p - (uRect.xy + uRect.zw * vec2(-.36, .56))) / (.20 * U)), 0.));
      mark = max(mark, step(handprint((p - (uRect.xy + uRect.zw * vec2(1.44, .66))) / (.17 * U) * vec2(-1., 1.)), 0.));
      vec2 z = (p - (uRect.xy + uRect.zw * vec2(1.10, .50))) / U;
      mark = max(mark, step(abs(z.y - abs(fract(z.x * 9.) - .5) * .07), .013) * step(0., z.x) * step(z.x, .44));
      vec2 pg = p / (2.6 * uD); float pit = step(hash(floor(pg)), .84) * (1. - smoothstep(.28, .55, length(fract(pg) - .5)));
      vec3 col = mix(rock, vec3(.90, .68, .45) * (.85 + .3 * rk), min(mark, 1.) * (.30 + .70 * pit));

    }`,
    // 2 Mesopotamia. A carved slab with real height: normals, raking light and cast shadows. The cursor is the lamp.
    `float relief(vec2 c){
      vec3 w = warp(c); float mk = smoothstep(.2, .8, maskW(w));
      float l = sm(w), h = .30 + .55 * texture2D(uDepth, w.xy).r + .50 * l;
      vec2 g = vec2(w.x, w.y / ASP);
      if (l < .24) h += cloth(w) ? .10 * step(length(fract(g * 9.) - .5), .30) + .08 * step(fract(g.y * 9.), .12)

    vec3 style(vec2 p){
      float r = 1.5 * uD, h0 = relief(p);
      vec3 n = normalize(vec3(relief(p - vec2(r, 0.)) - relief(p + vec2(r, 0.)), relief(p - vec2(0., r)) - relief(p + vec2(0., r)), .05));
      vec3 L = uMouse.x > -1000. ? normalize(vec3((uMouse - p) / (240. * uD), .5)) : normalize(vec3(-.55, -.6, .58));
      vec2 dir = normalize(L.xy + 1e-4); float rise = L.z / max(length(L.xy), .05), sh = 1.;
      for (int i = 1; i <= 6; i++) { float t = float(i) * 5. * uD; sh = min(sh, 1. - clamp((relief(p + dir * t) - h0 - t * rise / (60. * uD)) * 6., 0., 1.)); }
      float strata = vnoise(vec2(p.x / (300. * uD), p.y / (16. * uD))) * .5 + vnoise(p / (60. * uD)) * .5;
      vec3 col = vec3(.80, .67, .44) * (.86 + .2 * strata) * (.32 + .9 * clamp(dot(n, L), 0., 1.) * mix(.4, 1., sh));
      return col + vec3(1., .92, .75) * pow(clamp(reflect(-L, n).z, 0., 1.), 18.) * .12;
    }`,
    // 3 Egypt. Flat mineral colors and a dark outline on chipped plaster. The cursor restores it.
    `vec3 style(vec2 p){
      float heal = smoothstep(.08, .5, field(p));
      vec3 w = warp(p); float mk = smoothstep(.4, .6, maskW(w)), l = sm(w);
      vec3 plaster = vec3(.87, .79, .63) * (.90 + .14 * vnoise(p / (90. * uD)) + .05 * vnoise(p / (2.5 * uD)));
      vec3 c = vec3(.74, .37, .19);
      if (l < .21) c = cloth(w) ? vec3(.92, .90, .82) : vec3(.10, .08, .07);
      else if (l < .40) c = vec3(.58, .25, .13);
      else if (l > .80) c = vec3(.20, .50, .58);
      float cd = length(vec2(w.x - .50, (w.y - .52) / ASP));
      if (cloth(w) && l < .30 && cd > .17 && cd < .32) { float bnd = mod(floor((cd - .17) / .025), 4.);
        c = bnd < 1. ? vec3(.13, .47, .50) : (bnd < 2. ? vec3(.84, .62, .20) : (bnd < 3. ? vec3(.12, .20, .50) : vec3(.66, .20, .12)));
        c = mix(c, vec3(.16, .09, .06), step(fract((cd - .17) / .025), .14)); }
      c = mix(c, vec3(.16, .09, .06), smoothstep(.09, .17, edges(p, 1.8 * uD)));
      vec3 col = mix(plaster, c, mk);
      float n = vnoise(p / (28. * uD)) * .6 + vnoise(p / (7. * uD)) * .4;

      return mix(plaster, col, .78 + .22 * heal);
    }`,
    // 4 Hellenistic. A reassembled fresco: blue ground, painted borders, curled hair, a spotted garment, every fragment a slightly different age. The cursor repaints it.
    `vec3 band(vec2 g, float mott){
      float i = floor(g.x), hs = hash(vec2(i, 7.)); vec2 q = vec2(fract(g.x) - .5, g.y - 1.02); float r = length(q);
      vec3 pal = hs < .2 ? vec3(.80, .60, .25) : (hs < .4 ? vec3(.30, .48, .68) : (hs < .6 ? vec3(.86, .80, .70) : (hs < .8 ? vec3(.62, .30, .24) : vec3(.20, .22, .28))));
      vec3 c = vec3(.90, .86, .76);
      if (r < .60 && g.y > .16) {
        c = pal * (.85 + .3 * mott);
        c = mix(c, c * .70, step(.5, fract(r * 9.)) * .5);
        c = mix(c, vec3(.95, .92, .85), step(.88, hash(floor(q * 14.) + i)) * .8);
        c = mix(c, vec3(.18, .12, .10), step(.555, r));

      if (abs(g.y - .15) < .013 || abs(g.y - .89) < .013) c = vec3(.18, .12, .10);

    }
    vec3 style(vec2 p){
      float heal = smoothstep(.08, .5, field(p));
      vec3 w = warp(p); float mk = smoothstep(.4, .6, maskW(w)), l = sm(w);
      float mott = vnoise(p / (70. * uD)) * .6 + vnoise(p / (9. * uD)) * .4;
      vec2 g = vec2(w.x, w.y / ASP);
      vec3 c = vec3(.86, .60, .34);
      if (l < .21) {
        if (cloth(w)) {
          c = mix(vec3(.93, .89, .79), vec3(.78, .52, .22), smoothstep(.56, .60, vnoise(g * 9.)));
          c = mix(c, vec3(.22, .36, .58), step(fract(g.y * 11.), .10));
          c = mix(c, vec3(.62, .24, .14), step(length(fract(g * vec2(22., 11.) + vec2(0., .5)) - .5), .16) * step(.10, fract(g.y * 11.)) * .9);
        } else c = mix(vec3(.17, .09, .06), vec3(.44, .25, .13), step(fract(length(fract(g * 22.) - .5) * 3.6), .30));
      }
      else if (l < .36) c = vec3(.52, .23, .12);
      else if (l < .50) c = vec3(.68, .36, .18);
      else if (l < .66) c = vec3(.80, .50, .26);
      else if (l > .82) c = vec3(.96, .93, .85);
      c = mix(c * (.9 + .2 * mott), vec3(.20, .09, .05), max(smoothstep(.07, .13, edges(p, 1.5 * uD)), contour(w) * .9));

      float bh = .10 * min(uRes.x, uRes.y);

      float n = vnoise(p / (55. * uD)) * .6 + vnoise(p / (13. * uD)) * .4;
      col = mix(col, vec3(.72, .77, .80) * (.9 + .15 * mott), smoothstep(.70, .74, n) * (1. - heal) * .85 * (1. - mk * .5));

    }`,
    // 5 Rome. Mosaic in six stones on a grey-blue ground. The cursor wets the stone.
    `vec3 stone(float t){
      if (t < .17) return vec3(.11, .09, .08);
      if (t < .36) return vec3(.36, .20, .14);
      if (t < .54) return vec3(.64, .32, .20);
      if (t < .72) return vec3(.79, .55, .33);
      if (t < .88) return vec3(.89, .76, .57);
      return vec3(.95, .91, .82);

    vec3 style(vec2 p){

  function overTimeline(x, y) { const r = timeline.getBoundingClientRect(); return x > r.left - 8 && x < r.right + 8 && y > r.top - 8 && y < r.bottom + 8; }
  function onMove(e) {
    if (!m.inside) { m.px = e.clientX; m.py = e.clientY; }
    m.x = e.clientX; m.y = e.clientY; m.inside = true;
    if (fine && e.pointerType !== 'touch') {
      const over = overTimeline(m.x, m.y);
      pill.classList.add('follow'); pill.classList.toggle('away', over); setPill(m.x, m.y);
      hand.style.setProperty('--x', m.x + 'px'); hand.style.setProperty('--y', m.y + 'px');
      if (over) { showHand(stopAt(m.x, m.y)); swell(m.x, m.y); } else if (glyphShown >= 0) { hideHand(); swell(-1e4, -1e4); }
    }
  }
  function onLeave() {
    m.inside = false; m.x = m.px = -9999; m.y = m.py = -9999;
    pill.classList.remove('follow', 'press', 'away'); pill.style.removeProperty('--x'); pill.style.removeProperty('--y'); hideHand(); swell(-1e4, -1e4);
  }
  addEventListener('pointermove', onMove, { passive: true });
  addEventListener('pointerdown', e => { onMove(e); pill.classList.add('press'); hand.classList.add('press'); }, { passive: true });
  addEventListener('pointerup', e => { pill.classList.remove('press'); hand.classList.remove('press'); if (e.pointerType === 'touch') onLeave(); }, { passive: true });
  addEventListener('pointercancel', onLeave, { passive: true });
  document.documentElement.addEventListener('pointerleave', onLeave);
  addEventListener('blur', onLeave);
  // The pill sits under the cursor, so a click lands on the link itself. This covers the first click before any move.
  canvas.addEventListener('click', () => { if (fine) pill.click(); });

  // ---------- Frame ----------
  let last = performance.now(), t0 = last, flip = 0, tx;
  function draw(key, mix, dst, now) {
    const { p, u } = prog(key); gl.useProgram(p);
    [[tx.gray, u.uGray], [tx.color, u.uColor], [tx.smooth, u.uSmooth], [tx.oil, u.uOil], [tx.depth, u.uDepth], [dst.t, u.uTrail]].forEach(([t, loc], i) => {
      gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, i);
    });
    gl.uniform1f(u.uMix, mix); gl.uniform1f(u.uTime, reduce ? 0 : ((now - t0) / 1000) % 3600);
    gl.uniform2f(u.uRes, W, H); gl.uniform4f(u.uRect, rect[0], rect[1], rect[2], rect[3]);
    gl.uniform2f(u.uMouse, m.x * dpr, m.y * dpr); gl.uniform2f(u.uGaze, gaze.x, gaze.y);
    gl.uniform1f(u.uK, k); gl.uniform1f(u.uD, dpr); gl.uniform1f(u.uSigma, 105 * dpr);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;

    // Gaze: the head is fixed. The irises aim at the cursor and rest at center when it leaves.
    let gx = 0, gy = 0;
    if (m.inside) {
      const fx = (rect[0] + rect[2] * FACE[0]) / dpr, fy = (rect[1] + rect[3] * FACE[1]) / dpr;
      const r = Math.min(innerWidth, innerHeight) * .30;
      const vx = (m.x - fx) / r, vy = (m.y - fy) / r, len = Math.sqrt(1 + vx * vx + vy * vy);
      gx = vx / len; gy = vy / len;
    }
    const ease = 1 - Math.exp(-dt * 14);
    gaze.x += (gx - gaze.x) * ease; gaze.y += (gy - gaze.y) * ease;

    // Trail pass
    const dx = m.x - m.px, dy = m.y - m.py;
    const speed = m.inside ? Math.hypot(dx, dy) / Math.max(dt, .001) : 0;
    m.speed += (speed - m.speed) * .3;
    const src = trail[flip], dst = trail[flip ^= 1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, tw, th);
    gl.useProgram(trailProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t);
    gl.uniform1i(trailProg.u.uPrev, 0); gl.uniform2f(trailProg.u.uSize, tw, th);
    const hh = innerHeight;
    gl.uniform2f(trailProg.u.uA, m.px / TS, (hh - m.py) / TS); gl.uniform2f(trailProg.u.uB, m.x / TS, (hh - m.y) / TS);
    gl.uniform1f(trailProg.u.uPower, Math.min(1, m.speed / 500));
    gl.uniform1f(trailProg.u.uDecay, Math.pow(.2, dt));
    gl.uniform1f(trailProg.u.uRadius, 64 / TS);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    m.px = m.x; m.py = m.y;

    // Portrait pass: the outgoing era, then the incoming one dissolving in over it
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    let mix = Math.min(1, (now - era.start) / DUR); mix = mix * mix * (3 - 2 * mix);
    if (mix < 1) { draw(era.from, 2, dst, now); draw(era.to, mix, dst, now); }
    else draw(era.to, 2, dst, now);
    requestAnimationFrame(frame);
  }

  Promise.all(Object.values(SRC).map(load)).then(imgs => {
    const keys = Object.keys(SRC); tx = {}; imgs.forEach((im, i) => tx[keys[i]] = tex(0, 0, im));
    prog(NOW); resize(); addEventListener('resize', resize);
    window.__ready = true; window.__setEra = setEra;
    requestAnimationFrame(frame);
    // Compile the other eras one at a time while idle, so the first visit to each does not hitch.
    let n = 0; const warm = () => { if (n < STYLES.length) { try { prog(n++); } catch (e) { console.error('era ' + (n - 1), e.message); } setTimeout(warm, 80); } else window.__warm = true; };
    setTimeout(warm, 300);
  });
})();
</script>
</body>
