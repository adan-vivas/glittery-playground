<style>
  :root { --paper: #e8e7ee; --ink: #13131a; --blue: #1c2eff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); overflow: hidden; }
  body { font: 500 14px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

    border-radius: 999px; background: var(--ink); color: var(--paper);

    transition: transform .42s cubic-bezier(.22, 1, .36, 1);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #pill.follow { transition: none; }
  #pill.follow.press, #pill:active { --s: .95; }
  #pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  @media (hover: hover) and (pointer: fine) { html, body, canvas, #pill { cursor: none; } }
  @media (prefers-reduced-motion: reduce) { #pill { transition: none; } }
  noscript img { position: fixed; bottom: 0; left: 50%; height: 100%; transform: translateX(-50%); filter: grayscale(1) contrast(1.1); }

    uniform float uK, uSigma, uAmp;
    uniform vec3 uPaper, uInk, uBlue;

    float B2(vec2 a){ a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
    float B4(vec2 a){ return B2(.5 * a) * .25 + B2(a); }
    float B8(vec2 a){ return B4(.5 * a) * .25 + B2(a); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    float field(vec2 c){
      float t = texture2D(uTrail, vec2(c.x, uRes.y - c.y) / uRes).r;
      vec2 d = c - uMouse;
      float prox = exp(-dot(d, d) / (2. * uSigma * uSigma));
      return max(t * .9, prox);
    }
    float tone(vec2 c){
      vec2 uv = (c - uRect.xy) / uRect.zw;
      if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) return 1.;
      vec2 shift = uLook * uAmp * vec2(1., 0.63629);
      float d = texture2D(uDepth, uv).r;
      d = texture2D(uDepth, uv - (d - .3) * shift).r;
      vec2 st = clamp(uv - (d - .3) * shift, 0., 1.);
      vec3 rgb = texture2D(uPhoto, st).rgb;
      float l = dot(rgb, vec3(.299, .587, .114));
      l = pow(clamp((l - .02) / .90, 0., 1.), 1.25);
      float edge = smoothstep(0., .15, uv.x) * (1. - smoothstep(.85, 1., uv.x)) * smoothstep(0., .04, uv.y);
      return mix(1., l, edge);
    }
    void main(){
      vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
      float s = uK * 4.;
      vec2 id = floor(p / s); vec2 c = (id + .5) * s;
      float f = field(c) + (hash(id) - .5) * .10;
      float level = 0.;
      if (f > .14) {
        s = uK * 2.; id = floor(p / s); c = (id + .5) * s;
        f = field(c) + (hash(id + 17.) - .5) * .16; level = 1.;
        if (f > .52) { s = uK; id = floor(p / s); c = (id + .5) * s; f = field(c); level = 2.; }
      }
      float l = tone(c);
      float on = step(l, B8(id) * .97 + .012);
      vec2 q = abs(p - c);
      float shape = 1.;
      if (level < .5) shape = 1. - smoothstep(s * .44 - .75, s * .44 + .25, length(p - c));
      else if (level < 1.5 && s > 3.5) shape = step(max(q.x, q.y), s * .5 - .75);
      vec3 ink = mix(uInk, uBlue, smoothstep(.10, .62, f));
      gl_FragColor = vec4(mix(uPaper, ink, on * shape), 1.);
    }`;

  function program(fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }
  const trailProg = program(TRAIL), mainProg = program(MAIN);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function tex(w, h, data) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    if (data) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, data);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  const TS = 6;                         // trail texture is 1/6 of the canvas in CSS px
  let W = 0, H = 0, dpr = 1, k = 1, rect = [0, 0, 1, 1], trail = null, tw = 0, th = 0;
  function makeTarget() { const t = tex(tw, th); const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return { t, f }; }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = innerWidth, ch = innerHeight;
    W = canvas.width = Math.round(cw * dpr); H = canvas.height = Math.round(ch * dpr);
    k = Math.max(1, Math.round(dpr));
    const h = H, w = h * ASPECT;       // portrait fills the height, sits on the bottom edge, centered
    rect = [Math.round((W - w) / 2), 0, w, h];
    tw = Math.max(2, Math.ceil(cw / TS)); th = Math.max(2, Math.ceil(ch / TS));
    trail = [makeTarget(), makeTarget()];
  }

  // Pointer state, in CSS px
  const m = { x: -9999, y: -9999, px: -9999, py: -9999, inside: false, speed: 0 };
  const look = { x: 0, y: 0 };
  function setPill(x, y) { pill.style.setProperty('--x', x + 'px'); pill.style.setProperty('--y', y + 'px'); }
  function onMove(e) {
    if (!m.inside) { m.px = e.clientX; m.py = e.clientY; }
    m.x = e.clientX; m.y = e.clientY; m.inside = true;
    if (fine && e.pointerType !== 'touch') { pill.classList.add('follow'); setPill(m.x, m.y); }
  }
  function onLeave() {
    m.inside = false; m.x = m.px = -9999; m.y = m.py = -9999;
    pill.classList.remove('follow', 'press'); pill.style.removeProperty('--x'); pill.style.removeProperty('--y');
  }
  addEventListener('pointermove', onMove, { passive: true });
  addEventListener('pointerdown', e => { onMove(e); pill.classList.add('press'); }, { passive: true });
  addEventListener('pointerup', e => { pill.classList.remove('press'); if (e.pointerType === 'touch') onLeave(); }, { passive: true });
  addEventListener('pointercancel', onLeave, { passive: true });
  document.documentElement.addEventListener('pointerleave', onLeave);
  addEventListener('blur', onLeave);
  // The pill sits under the cursor, so a click lands on the link itself. This covers the first click before any move.
  canvas.addEventListener('click', () => { if (fine) pill.click(); });

  const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const css = getComputedStyle(document.documentElement);
  const PAPER = rgb(css.getPropertyValue('--paper').trim()), INK = rgb(css.getPropertyValue('--ink').trim()), BLUE = rgb(css.getPropertyValue('--blue').trim());

  let last = performance.now(), t0 = last, flip = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;

    // Look direction: toward the cursor, measured from the face. A slow drift when nobody is there.
    let tx = 0, ty = 0;
    if (m.inside) {
      const fx = (rect[0] + rect[2] * FACE[0]) / dpr, fy = (rect[1] + rect[3] * FACE[1]) / dpr;
      const r = Math.min(innerWidth, innerHeight) * .42;
      const vx = (m.x - fx) / r, vy = (m.y - fy) / r, len = Math.sqrt(1 + vx * vx + vy * vy);
      tx = vx / len; ty = vy / len;
    } else if (!reduce) {
      const t = (now - t0) / 1000; tx = Math.sin(t * .55) * .32; ty = Math.sin(t * .37 + 1.2) * .14;
    }
    const ease = 1 - Math.exp(-dt * (m.inside ? 9 : 2.5));
    look.x += (tx - look.x) * ease; look.y += (ty - look.y) * ease;

    // Trail pass
    const dx = m.x - m.px, dy = m.y - m.py;
    const speed = m.inside ? Math.hypot(dx, dy) / Math.max(dt, .001) : 0;
    m.speed += (speed - m.speed) * .3;
    const src = trail[flip], dst = trail[flip ^= 1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, tw, th);
    gl.useProgram(trailProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t);
    gl.uniform1i(trailProg.u.uPrev, 0); gl.uniform2f(trailProg.u.uSize, tw, th);
    const hh = innerHeight;
    gl.uniform2f(trailProg.u.uA, m.px / TS, (hh - m.py) / TS); gl.uniform2f(trailProg.u.uB, m.x / TS, (hh - m.y) / TS);
    gl.uniform1f(trailProg.u.uPower, Math.min(1, m.speed / 500));
    gl.uniform1f(trailProg.u.uDecay, Math.pow(.2, dt));
    gl.uniform1f(trailProg.u.uRadius, 64 / TS);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    m.px = m.x; m.py = m.y;

    // Portrait pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    gl.useProgram(mainProg.p); const u = mainProg.u;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, photoTex); gl.uniform1i(u.uPhoto, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depthTex); gl.uniform1i(u.uDepth, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, dst.t); gl.uniform1i(u.uTrail, 2);
    gl.uniform2f(u.uRes, W, H); gl.uniform4f(u.uRect, rect[0], rect[1], rect[2], rect[3]);
    gl.uniform2f(u.uMouse, m.x * dpr, m.y * dpr); gl.uniform2f(u.uLook, look.x, look.y);
    gl.uniform1f(u.uK, k); gl.uniform1f(u.uSigma, 105 * dpr); gl.uniform1f(u.uAmp, reduce ? .035 : .075);
    gl.uniform3fv(u.uPaper, PAPER); gl.uniform3fv(u.uInk, INK); gl.uniform3fv(u.uBlue, BLUE);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  let photoTex, depthTex;
  Promise.all([load(PHOTO), load(DEPTH)]).then(([p, d]) => {
    photoTex = tex(0, 0, p); depthTex = tex(0, 0, d);
    resize(); addEventListener('resize', resize);
    window.__ready = true;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
