<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earned edits — toggle prototype</title>
<style>
  :root{
    --ink:#0F1419;
    --dim:#536471;
    --hair:#C8D2D7;
    --btn:rgb(34,38,42);
    --track:#EFF3F4;
    --blue:#1D9BF0;
    --closeDur:240ms;
    --absorbDur:440ms;
    --tModalIn:180ms;
    --tMenu:130ms;
    --font:"Chirp",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0B0E11;font-family:var(--font);-webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #stageBox{flex:1 1 auto;min-height:0;display:grid;place-items:center;overflow:hidden}
  #strip{flex:none;height:58px;display:flex;align-items:center;justify-content:center}
  #stage{
    width:1744px;height:1049px;position:relative;flex:none;
    transform-origin:center center;background:#fff;
    border-radius:6px;overflow:hidden;
  }
  #plate{position:absolute;inset:0;width:1744px;height:1049px;display:block;user-select:none;-webkit-user-drag:none}
  #ripple{position:absolute;left:0;top:0;width:1744px;height:1049px;display:block;pointer-events:none}

  /* ---------- entry: overflow button + post menu ---------- */
  #dots{
    position:absolute;left:1070.75px;top:228.25px;width:35px;height:35px;
    border:0;padding:0;background:transparent;border-radius:999px;cursor:pointer;
  }
  #dots::after{
    content:'';position:absolute;inset:0;border-radius:999px;
    background:rgba(29,155,240,.1);opacity:0;transition:opacity 120ms ease;
  }
  #dots:hover::after,#dots:focus-visible::after{opacity:1}
  #dots:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  #ping{
    position:absolute;inset:-4px;border-radius:999px;pointer-events:none;
    border:2px solid rgba(29,155,240,.85);opacity:0;
    animation:ping 1.9s cubic-bezier(.2,.7,.3,1) 3;
  }
  @keyframes ping{
    0%{transform:scale(.72);opacity:0}
    16%{opacity:.9}
    100%{transform:scale(1.75);opacity:0}
  }
  #stage.busy #ping{animation:none;opacity:0}

  #menu{
    position:absolute;left:808px;top:235px;width:289.5px;height:484.5px;
    border-radius:16px;overflow:hidden;isolation:isolate;
    box-shadow:rgba(101,119,134,.2) 0 0 15px, rgba(101,119,134,.15) 0 0 3px 1px;
    transform-origin:100% 0;transform:scale(.96);opacity:0;pointer-events:none;
    transition:opacity var(--tMenu) ease, transform var(--tMenu) cubic-bezier(.2,.8,.2,1);
  }
  #menu.on{transform:scale(1);opacity:1;pointer-events:auto}
  #menuImg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .mrow{
    position:absolute;left:0;width:100%;height:44px;background:#EFF3F4;
    mix-blend-mode:multiply;opacity:0;transition:opacity 90ms ease;cursor:default;
  }
  .mrow:hover{opacity:1}
  .mrow.act{cursor:pointer}
  .mrow.act:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-2px}

  /* ---------- dialog ---------- */
  #scrim{
    position:absolute;inset:0;background:rgba(0,0,0,.44);
    opacity:0;transition:opacity 200ms ease;
  }
  #stage.open #scrim{opacity:1}
  #modal{
    position:absolute;left:50%;top:50%;width:600px;
    transform:translate(-50%,-50%) scale(.965);opacity:0;
    transition:opacity var(--tModalIn) ease, transform var(--tModalIn) cubic-bezier(.2,.8,.2,1);
    background:#fff;border-radius:16px;padding:84px 0 80px;
    box-shadow:rgba(101,119,134,.2) 0 0 15px, rgba(101,119,134,.15) 0 0 3px 1px;
    will-change:transform,opacity;
  }
  #stage.open #modal{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #stage.closing #modal{
    opacity:0;transform:translate(-50%,-50%) scale(.955);
    transition:opacity var(--closeDur) ease, transform var(--closeDur) cubic-bezier(.4,0,1,1);
  }
  #stage.closing #scrim{opacity:0;transition:opacity var(--closeDur) ease}
  /* the wave takes the dialog with it: recedes into the surface, holds a beat, then goes */
  #stage.absorb #modal{
    opacity:0;transform:translate(-50%,-50%) scale(.90);
    transition:opacity calc(var(--absorbDur)*.8) cubic-bezier(.5,0,.75,.5),
               transform var(--absorbDur) cubic-bezier(.2,.86,.3,1);
  }
  #stage.absorb #scrim{
    opacity:0;transition:opacity calc(var(--absorbDur)*1.3) ease calc(var(--absorbDur)*.15);
  }
  #stage:not(.open) #modal,#stage:not(.open) #scrim{pointer-events:none}

  .col{width:400px;margin:0 auto}
  h1{
    margin:0;font-size:28px;line-height:32px;font-weight:800;
    letter-spacing:-.2px;color:var(--ink);
  }
  .sub{margin:8px 0 0;font-size:16px;line-height:20px;color:var(--dim)}

  #close{
    position:absolute;top:9px;left:9px;width:34px;height:34px;border:0;padding:0;
    border-radius:999px;background:transparent;display:grid;place-items:center;
    cursor:pointer;transition:background 120ms ease;
  }
  #close:hover{background:rgba(15,20,25,.1)}
  #close svg{width:21px;height:21px;fill:var(--ink)}

  .btn{
    display:block;width:400px;height:52px;border-radius:26px;border:0;
    font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;
    transition:filter 120ms ease,background 120ms ease;
  }
  .primary{background:var(--btn);color:#fff;margin-top:24px}
  .primary:hover{filter:brightness(1.35)}
  .ghost{background:#fff;color:var(--ink);border:1px solid var(--hair);margin-top:16px}
  .ghost:hover{background:#F7F9F9}

  /* ---------- the new control ---------- */
  .swWrap{position:relative;margin-top:24px}
  #sw{
    position:relative;display:block;width:400px;height:52px;border:0;padding:0;
    border-radius:26px;background:var(--track);cursor:pointer;overflow:visible;
    box-shadow:inset 0 1px 2px rgba(15,20,25,.07);
    transition:box-shadow 260ms ease, transform 120ms ease;
    -webkit-tap-highlight-color:transparent;
  }
  #sw:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  #sw.lit{box-shadow:0 0 0 1px rgba(29,155,240,.35),0 6px 26px rgba(29,155,240,.40),0 2px 8px rgba(11,42,82,.28)}
  #skin{position:absolute;inset:0;border-radius:26px;overflow:hidden}
  #fill{
    position:absolute;inset:0;
    background:linear-gradient(90deg,#0B2A52 0%,#155FA8 44%,#14639F 58%,#1D9BF0 84%,#5BDCFF 100%);
    clip-path:inset(0 100% 0 0);
  }
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .lbl{
    position:absolute;left:0;right:0;top:0;height:52px;display:grid;place-items:center;
    font-size:15px;font-weight:700;letter-spacing:.1px;pointer-events:none;
  }
  #lblOff{color:var(--ink)}
  #lblOn{color:#fff;opacity:0;text-shadow:0 1px 10px rgba(3,22,44,.55),0 0 2px rgba(3,22,44,.35)}
  #knob{
    position:absolute;top:4px;left:4px;width:44px;height:44px;border-radius:999px;
    background:#fff;display:grid;place-items:center;pointer-events:none;
    box-shadow:0 1px 2px rgba(15,20,25,.22),0 3px 10px rgba(15,20,25,.14);
    will-change:transform;
  }
  #knob svg{position:absolute;left:50%;top:50%;width:19px;height:19px;margin:-9.5px 0 0 -9.5px}
  #icoRe{fill:var(--dim)}
  #icoEd{fill:var(--blue);opacity:0}
  .cap{
    margin:8px 0 0;font-size:13px;line-height:16px;color:var(--dim);text-align:center;
    transition:color 200ms ease;
  }

  /* insufficient-balance variant */
  #sw.locked{cursor:default}
  #sw.locked #lblOff{color:var(--dim)}
  #prog{
    position:absolute;left:0;top:0;bottom:0;background:#DFE7EB;
    border-radius:26px 0 0 26px;width:0;transition:width 500ms cubic-bezier(.2,.8,.2,1);
  }
  #sw.locked #knob{background:#F7F9F9;box-shadow:0 1px 2px rgba(15,20,25,.12)}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #sw.nudge{animation:nudge 240ms ease}

  /* ---------- toast ---------- */
  #toast{
    position:absolute;left:50%;bottom:34px;transform:translate(-50%,18px);
    background:var(--ink);color:#fff;font-size:15px;font-weight:500;
    padding:13px 20px;border-radius:999px;display:flex;align-items:center;gap:9px;
    box-shadow:0 8px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;
    transition:opacity 240ms ease,transform 320ms cubic-bezier(.2,.9,.2,1);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast svg{width:17px;height:17px;fill:#5BDCFF}

  /* ---------- prototype chrome ---------- */
  #panel{
    position:relative;display:flex;align-items:center;gap:8px;z-index:20;
    background:rgba(18,22,26,.88);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:8px 10px;
    font-size:11.5px;color:#AEB8BF;letter-spacing:.2px;
    transition:opacity 200ms ease, padding 240ms cubic-bezier(.2,.8,.2,1);
  }
  #panel.min{padding:6px 8px;opacity:.55}
  #panel.min:hover,#panel.min:focus-within{opacity:1}
  #panel.away{opacity:.07}
  #panel.away:hover,#panel.away:focus-within{opacity:1}
  #handle{
    display:flex;align-items:center;gap:6px;background:transparent;border:0;
    color:#7C8993;text-transform:uppercase;letter-spacing:.4px;font-size:11.5px;
    font-family:inherit;cursor:pointer;padding:3px 4px;border-radius:8px;
  }
  #handle:hover{color:#C9D3DA}
  #handle i{width:6px;height:6px;border-radius:999px;background:#5BDCFF;display:block;flex:none}
  #handle .chev{
    width:13px;height:13px;fill:currentColor;transform:rotate(180deg);
    transition:transform 240ms cubic-bezier(.2,.8,.2,1);
  }
  #panel.min #handle .chev{transform:rotate(0deg)}
  #pbody{
    display:flex;align-items:center;gap:8px;overflow:hidden;
    transition:max-width 260ms cubic-bezier(.2,.8,.2,1), opacity 170ms ease;
  }
  #pbody>*{flex:none}
  #panel.min #pbody{max-width:0!important;opacity:0}
  #panel .grp{display:flex;background:rgba(255,255,255,.07);border-radius:9px;padding:2px}
  #panel button{
    font-family:inherit;font-size:11.5px;color:#AEB8BF;background:transparent;border:0;
    padding:5px 9px;border-radius:7px;cursor:pointer;letter-spacing:.2px;
  }
  #panel button:hover{color:#fff}
  #panel button.sel{background:#EAF0F3;color:#12161A;font-weight:700}
  #panel .go{background:#EAF0F3;color:#12161A;font-weight:700;padding:6px 12px;border-radius:9px}
  #panel .sep{width:1px;height:20px;background:rgba(255,255,255,.1)}
  #panel label{display:flex;align-items:center;gap:6px;cursor:pointer;padding-left:2px}
  #panel input{accent-color:#5BDCFF;margin:0}
  #panel input[type=range]{width:84px;height:14px}
  #panel label b{font-weight:700;color:#E7ECEF;min-width:30px;text-align:right}

  @media (prefers-reduced-motion:reduce){
    #modal,#scrim,#toast{transition-duration:1ms}
  }
</style>
</head>

' vec3 outc=mix(vec3(1.),col,m)+u_flash;',
' float a=max(m,sheen*.30);',
' outc+=(h(gl_FragCoord.xy+t)-.5)*.014;',
' gl_FragColor=vec4(clamp(outc,0.,1.),clamp(a,0.,1.));',
'}'].join('\n');

function initGL(){
  try{gl=cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,depth:false});}catch(e){}
  if(!gl){return false;}
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;}
  var vs=sh(gl.VERTEX_SHADER,VS),fs=sh(gl.FRAGMENT_SHADER,FS);
  if(!vs||!fs){gl=null;return false;}
  var pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){gl=null;return false;}
  gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['u_res','u_t','u_p','u_hov','u_flash','u_settle'].forEach(function(k){uni[k]=gl.getUniformLocation(pr,k);});
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  return true;
}
/* ---------- full-page water: refracts the platform itself ---------- */
var rgl=null,rUni={},rTex=null,rT=0,rLife=0,rOn=false,rOrg=[.5,.5],rDirty=true,rAmt=.62;
var RFS=[
'#ifdef GL_FRAGMENT_PRECISION_HIGH',' precision highp float;','#else',' precision mediump float;','#endif',
'uniform sampler2D u_tex;uniform vec2 u_res,u_org;uniform float u_t,u_life,u_amt;',
'void main(){',
' vec2 uv=gl_FragCoord.xy/u_res;',
' float ar=u_res.x/u_res.y;',
' vec2 pp=vec2((uv.x-u_org.x)*ar,uv.y-u_org.y);',
' float r=length(pp);',
' vec2 dir=r>.0006?pp/r:vec2(0.);',
' float amp=0.,crest=0.;',
/* three wavefronts leaving the switch, losing energy as they spread */
' for(int i=0;i<3;i++){',
'  float fi=float(i);',
'  float tt=u_t-fi*.16;',
'  if(tt>0.){',
'   float rf=tt*.50;',
'   float d=r-rf;',
'   float band=exp(-d*d*90.);',
'   float dec=exp(-tt*.38)/(1.+rf*1.1);',
'   amp+=sin(d*(24.-fi*5.)*3.14159-tt*1.1)*band*dec*(1.-fi*.28);',
'   crest+=band*dec*(1.-fi*.30);',
'  }',
' }',
/* residue of the infusion: a slow shimmer that decays over the whole surface */
' float shim=sin(r*40.-u_t*2.2)*exp(-u_t*.5)*.0012*min(1.,u_t*3.);',
' amp*=smoothstep(0.,.055,r)*(.55+.45*u_amt);',
' vec2 off=dir*(amp*.015+shim);',
' vec3 col;',
' col.r=texture2D(u_tex,uv+off*1.07).r;',
' col.g=texture2D(u_tex,uv+off).g;',
' col.b=texture2D(u_tex,uv+off*.93).b;',
' float c=clamp(crest,0.,1.);',
' col+=vec3(.34,.66,1.)*c*.11*u_amt;',
' col=mix(col,col*vec3(.90,.98,1.06),c*.70*u_amt);',
' gl_FragColor=vec4(clamp(col,0.,1.),clamp(u_life*u_amt,0.,1.));',
'}'].join('\n');

function initRipple(){
  try{rgl=rc.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,depth:false});}catch(e){}
  if(!rgl)return false;
  function sh(ty,src){var o=rgl.createShader(ty);rgl.shaderSource(o,src);rgl.compileShader(o);
    if(!rgl.getShaderParameter(o,rgl.COMPILE_STATUS)){console.warn(rgl.getShaderInfoLog(o));return null;}return o;}
  var vs=sh(rgl.VERTEX_SHADER,VS),fs=sh(rgl.FRAGMENT_SHADER,RFS);
  if(!vs||!fs){rgl=null;return false;}
  var pr=rgl.createProgram();rgl.attachShader(pr,vs);rgl.attachShader(pr,fs);rgl.linkProgram(pr);
  if(!rgl.getProgramParameter(pr,rgl.LINK_STATUS)){rgl=null;return false;}
  rgl.useProgram(pr);
  var b=rgl.createBuffer();rgl.bindBuffer(rgl.ARRAY_BUFFER,b);
  rgl.bufferData(rgl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),rgl.STATIC_DRAW);
  var loc=rgl.getAttribLocation(pr,'a');rgl.enableVertexAttribArray(loc);
  rgl.vertexAttribPointer(loc,2,rgl.FLOAT,false,0,0);
  ['u_tex','u_res','u_org','u_t','u_life','u_amt'].forEach(function(k){rUni[k]=rgl.getUniformLocation(pr,k);});
  rTex=rgl.createTexture();
  rgl.bindTexture(rgl.TEXTURE_2D,rTex);
  rgl.texParameteri(rgl.TEXTURE_2D,rgl.TEXTURE_WRAP_S,rgl.CLAMP_TO_EDGE);
  rgl.texParameteri(rgl.TEXTURE_2D,rgl.TEXTURE_WRAP_T,rgl.CLAMP_TO_EDGE);
  rgl.texParameteri(rgl.TEXTURE_2D,rgl.TEXTURE_MIN_FILTER,rgl.LINEAR);
  rgl.texParameteri(rgl.TEXTURE_2D,rgl.TEXTURE_MAG_FILTER,rgl.LINEAR);
  rgl.pixelStorei(rgl.UNPACK_FLIP_Y_WEBGL,true);
  rgl.enable(rgl.BLEND);rgl.blendFunc(rgl.SRC_ALPHA,rgl.ONE_MINUS_SRC_ALPHA);
  rgl.uniform1i(rUni.u_tex,0);
  return true;
}
function sizeRipple(){
  if(!rgl)return;
  var w=Math.min(2800,Math.max(600,Math.round(1744*scale*DPR)));
  var h=Math.round(w*1049/1744);
  if(rc.width!==w||rc.height!==h){rc.width=w;rc.height=h;rgl.viewport(0,0,w,h);rDirty=true;}
  if(rDirty)uploadPlate();
}
function uploadPlate(){
  if(!rgl||!plate.naturalWidth)return;
  /* downscale through 2D canvas so texels land 1:1 and the timeline text stays clean */
  var c2=document.createElement('canvas');c2.width=rc.width;c2.height=rc.height;
  var cx=c2.getContext('2d');cx.imageSmoothingQuality='high';
  cx.drawImage(plate,0,0,c2.width,c2.height);
  rgl.bindTexture(rgl.TEXTURE_2D,rTex);
  rgl.texImage2D(rgl.TEXTURE_2D,0,rgl.RGBA,rgl.RGBA,rgl.UNSIGNED_BYTE,c2);
  rDirty=false;
}
function drawRipple(){
  if(!rgl)return;
  rgl.uniform2f(rUni.u_res,rc.width,rc.height);
  rgl.uniform2f(rUni.u_org,rOrg[0],rOrg[1]);
  rgl.uniform1f(rUni.u_t,rT);rgl.uniform1f(rUni.u_life,rLife);
  rgl.uniform1f(rUni.u_amt,rAmt);
  rgl.clearColor(0,0,0,0);rgl.clear(rgl.COLOR_BUFFER_BIT);
  rgl.drawArrays(rgl.TRIANGLE_STRIP,0,4);
}
function clearRipple(){if(rgl){rgl.clearColor(0,0,0,0);rgl.clear(rgl.COLOR_BUFFER_BIT);}}
function startRipple(){
  if(!rgl||REDUCED)return;
  var sr=stage.getBoundingClientRect(),br=sw.getBoundingClientRect();
  var cx=((br.left+br.width/2)-sr.left)/Math.max(.2,scale);
  var cy=((br.top+br.height/2)-sr.top)/Math.max(.2,scale);
  rOrg=[cx/1744,1-cy/1049];
  rT=0;rLife=0;rOn=true;
}
function fadeRipple(){if(rOn)rT=Math.max(rT,RIP_END);}
function killRipple(){rOn=false;rLife=0;clearRipple();}
var RIP_END=3.2;

var DPR=Math.min(devicePixelRatio||1,2);
function sizeCanvas(){
  if(!gl)return;
  var w=Math.max(2,Math.round(TRACK*scale*DPR)),h=Math.max(2,Math.round(52*scale*DPR));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);}
}
function draw(){
  if(!gl)return;
  gl.uniform2f(uni.u_res,cv.width,cv.height);
  gl.uniform1f(uni.u_t,t);gl.uniform1f(uni.u_p,x);
  gl.uniform1f(uni.u_hov,hover);gl.uniform1f(uni.u_flash,flash);gl.uniform1f(uni.u_settle,settle);
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- spring ---------- */
var x=0,v=0,target=0,dragging=false,committed=false,locked=false;
var K=175,ZETA=.60;

function paint(){
  var px=x*TRAVEL;
  var squash=Math.min(.12,Math.abs(v)*.045);
  var sx=1+squash, sy=1-squash*.8;
  knob.style.transform='translateX('+px+'px) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
  icoRe.style.transform='rotate('+(x*190).toFixed(1)+'deg)';
  icoRe.style.opacity=Math.max(0,1-x*2.1);
  icoEd.style.opacity=Math.max(0,(x-.52)*2.6);
  fill.style.clipPath='inset(0 '+((1-x)*100).toFixed(2)+'% 0 0)';
  var o1=Math.max(0,1-x*2.4), o2=Math.max(0,Math.min(1,(x-.42)*2.8));
  lblOff.style.opacity=o1; lblOff.style.transform='translateY('+(-4*(1-o1)).toFixed(2)+'px)';
  lblOn.style.opacity=o2;  lblOn.style.transform='translateY('+(5*(1-o2)).toFixed(2)+'px)';
  knob.style.boxShadow=x>.5
    ? '0 1px 2px rgba(4,26,50,.30),0 4px 14px rgba(4,26,50,.24)'
    : '0 1px 2px rgba(15,20,25,.22),0 3px 10px rgba(15,20,25,.14)';
}

/* ---------- scheduler on the scaled clock ---------- */
var queue=[];
function later(sec,fn){queue.push({t:sec,fn:fn});}
function clearQueue(){queue.length=0;}

var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(.05,(ts-last)/1000);last=ts;
  var sdt=dt*speed;

  for(var i=queue.length-1;i>=0;i--){queue[i].t-=sdt;if(queue[i].t<=0){var f=queue[i].fn;queue.splice(i,1);f();}}

  if(!dragging&&!locked&&!REDUCED){
    var c=2*Math.sqrt(K)*ZETA;
    var a=-K*(x-target)-c*v;
    v+=a*sdt;x+=v*sdt;
    if(x>1){x=1;if(v>0)v*=-.18;}
    if(x<0){x=0;if(v<0)v*=-.18;}
    if(Math.abs(x-target)<.0004&&Math.abs(v)<.02){x=target;v=0;}
  }
  if(REDUCED&&!dragging){x+=(target-x)*Math.min(1,sdt*9);v=0;}

  if(!committed&&x>.985&&target===1){commit();}
  if(committed&&x<.5&&target===0){uncommit();}

  flow+= ((committed?(settle>.5?.55:1.6):1)-flow)*Math.min(1,sdt*4);
  t+=sdt*flow*.85;
  if(committed)settle=Math.min(1,settle+sdt*1.1); else settle=Math.max(0,settle-sdt*2.2);
  flash=Math.max(0,flash-sdt*4.2);
  hover+=((hoverWant&&!committed&&!locked?1:0)-hover)*Math.min(1,sdt*7);

  if(rOn){
    rT+=sdt;
    rLife=Math.min(1,rLife+sdt/.12);
    if(rT>RIP_END){rLife-=sdt/.45;if(rLife<=0){rLife=0;rOn=false;clearRipple();}}
    if(rOn)drawRipple();
  }else if(rLife>0){rLife=0;clearRipple();}

  paint();
  if(gl&&(x>.001||hover>.004||flash>.001))draw();
  else if(gl){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);}
}
requestAnimationFrame(loop);

/* ---------- commit ---------- */
function commit(){
  committed=true;flash=REDUCED?0:.42;settle=0;
  sw.classList.add('lit');sw.setAttribute('aria-checked','true');
  startRipple();
  if(!REDUCED){panel.classList.add('away');later(RIP_END+.6,function(){panel.classList.remove('away');});}
  if(autoClose)later(REDUCED?.4:.08,function(){close(true,!REDUCED);});
}
function uncommit(){
  committed=false;clearQueue();fadeRipple();panelBack();sw.classList.remove('lit');
  sw.setAttribute('aria-checked','false');
}
/* ---------- entry flow: overflow button -> menu -> dialog ---------- */
var ROWS=['Delete','Edit','Pin to your profile','Highlight on your profile',
  'Add/remove from Lists','Add/remove content disclosure','Change who can reply',
  'View post activity','Embed post','View post analytics','Request Community Note'];
(function buildRows(){
  for(var i=0;i<ROWS.length;i++){
    var d=document.createElement('div');
    d.className='mrow'+(i===1?' act':'');
    d.style.top=(0.5+i*44)+'px';
    d.setAttribute('role','menuitem');
    d.setAttribute('aria-label',ROWS[i]);
    d.tabIndex=i===1?0:-1;
    if(i===1){
      d.addEventListener('click',chooseEdit);
      d.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseEdit();}
      });
    }
    menu.appendChild(d);
  }
})();
function openMenu(){
  menu.classList.add('on');stage.classList.add('busy');
  dots.setAttribute('aria-expanded','true');
  var edit=menu.querySelector('.mrow.act');
  later(.22,function(){if(menu.classList.contains('on'))edit.focus({preventScroll:true});});
}
function closeMenu(){
  menu.classList.remove('on');dots.setAttribute('aria-expanded','false');
  if(!stage.classList.contains('open'))feedState();
}
function chooseEdit(){
  menu.classList.remove('on');dots.setAttribute('aria-expanded','false');
  later(.06,openModal);
}
function feedState(){stage.classList.remove('busy');armHint();}
function panelBack(){if(panel)panel.classList.remove('away');}
function armHint(){ping.style.animation='none';void ping.offsetWidth;ping.style.animation='';}
function restart(){
  clearQueue();killRipple();toast.classList.remove('show');panelBack();
  menu.classList.remove('on');dots.setAttribute('aria-expanded','false');
  stage.classList.remove('open','closing','absorb');
  committed=false;target=0;x=0;v=0;settle=0;flash=0;
  sw.classList.remove('lit','nudge');sw.setAttribute('aria-checked','false');
  applyBalance();paint();feedState();
}
dots.addEventListener('click',function(e){
  e.stopPropagation();
  if(menu.classList.contains('on'))closeMenu();else openMenu();
});
addEventListener('pointerdown',function(e){
  if(!menu.classList.contains('on'))return;
  if(!e.target||!e.target.closest)return;
  if(e.target.closest('#menu')||e.target.closest('#dots'))return;
  closeMenu();
},true);

/* ---------- open / close ---------- */
function close(showToast,absorb){
  stage.classList.remove('open');
  stage.classList.add(absorb?'absorb':'closing');
  later(absorb?.66:.30,feedState);
  if(showToast){
    later(absorb?.85:.16,function(){
      toastTxt.textContent=COPY.rich.toast;
      toast.classList.add('show');
      later(3.4,function(){toast.classList.remove('show');});
    });
  }
}
function openModal(){
  clearQueue();toast.classList.remove('show');killRipple();panelBack();
  menu.classList.remove('on');
  committed=false;target=0;x=0;v=0;settle=0;flash=0;
  sw.classList.remove('lit','nudge');sw.setAttribute('aria-checked','false');
  applyBalance();paint();
  stage.classList.add('busy');
  stage.classList.remove('closing','absorb');stage.classList.add('open');
}
function applyBalance(){
  locked=(balance==='poor');
  lblOff.textContent=COPY[balance].off;
  lblOn.textContent=COPY.rich.on;
  sw.classList.toggle('locked',locked);
  sw.setAttribute('aria-disabled',locked?'true':'false');
  prog.style.width=locked?'64%':'0%';
  icoRe.style.fill=locked?'#8B98A5':'#536471';
}

/* ---------- input ---------- */
var hoverWant=false;
sw.addEventListener('pointerenter',function(){hoverWant=true;});
sw.addEventListener('pointerleave',function(){hoverWant=false;});

var down=null;
sw.addEventListener('pointerdown',function(e){
  if(locked){sw.classList.remove('nudge');void sw.offsetWidth;sw.classList.add('nudge');
    prog.style.width='69%';setTimeout(function(){prog.style.width='64%';},260);return;}
  sw.setPointerCapture(e.pointerId);
  down={x:e.clientX,x0:x,moved:false};
  dragging=true;clearQueue();
});
sw.addEventListener('pointermove',function(e){
  if(!down)return;
  var dx=(e.clientX-down.x)/Math.max(.2,scale);
  if(Math.abs(dx)>3)down.moved=true;
  x=Math.max(0,Math.min(1,down.x0+dx/TRAVEL));
  v=0;
  if(committed&&x<.5)uncommit();
  if(!committed&&x>.985){target=1;dragging=false;down.moved=true;commit();}
});
function release(e){
  if(!down)return;
  dragging=false;
  if(!down.moved){target=target?0:1;}
  else{target=(x>.42)?1:0;}
  if(target===0&&committed)uncommit();
  down=null;
}
sw.addEventListener('pointerup',release);
sw.addEventListener('pointercancel',release);
sw.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(locked)return;target=target?0:1;if(target===0&&committed)uncommit();}
});

document.getElementById('later').onclick=function(){close(false);};
document.getElementById('close').onclick=function(){close(false);};
document.getElementById('up').onclick=function(){close(false);};
scrim.onclick=function(){close(false);};

/* ---------- panel ---------- */
document.getElementById('restart').onclick=restart;
document.getElementById('jump').onclick=openModal;
function setSpeed(v){
  speed=v;
  stage.style.setProperty('--tMenu',Math.round(130/v)+'ms');
  stage.style.setProperty('--tModalIn',Math.round(180/v)+'ms');
  stage.style.setProperty('--closeDur',Math.round(240/v)+'ms');
  stage.style.setProperty('--absorbDur',Math.round(440/v)+'ms');
}
document.getElementById('spd').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  [].forEach.call(this.children,function(c){c.classList.remove('sel');});
  b.classList.add('sel');setSpeed(parseFloat(b.dataset.s));
};
document.getElementById('bal').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  [].forEach.call(this.children,function(c){c.classList.remove('sel');});
  b.classList.add('sel');balance=b.dataset.b;openModal();
};
document.getElementById('auto').onchange=function(){autoClose=this.checked;};
(function(){
  var r=document.getElementById('amt'),lab=document.getElementById('amtv');
  r.oninput=function(){rAmt=this.value/100;lab.textContent=this.value+'%';};
})();

/* the fixture collapses to its handle so it stays out of the frame */
var panel=document.getElementById('panel'),
    pbody=document.getElementById('pbody'),
    handle=document.getElementById('handle'),pw=0;
function measurePanel(){
  pbody.style.maxWidth='none';
  pw=pbody.scrollWidth;
  pbody.style.maxWidth=pw+'px';
}
function togglePanel(min){
  if(min===undefined)min=!panel.classList.contains('min');
  if(!min)pbody.style.maxWidth=pw+'px';
  panel.classList.toggle('min',min);
  handle.setAttribute('aria-expanded',min?'false':'true');
  handle.title=min?'Show controls (H)':'Hide controls (H)';
}
handle.onclick=function(){togglePanel();};
addEventListener('resize',function(){if(!panel.classList.contains('min'))measurePanel();});
measurePanel();
addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){
    if(menu.classList.contains('on')){closeMenu();dots.focus();}
    else if(stage.classList.contains('open'))close(false);
    return;
  }
  if(e.target===sw||e.target.classList.contains('mrow'))return;
  if(e.key==='Enter'&&!stage.classList.contains('open')){openModal();}
  if(e.key==='r'||e.key==='R'){restart();}
  if(e.key==='h'||e.key==='H'){togglePanel();}
});

initGL();initRipple();setSpeed(1);
if(plate.complete&&plate.naturalWidth){fit();}
else{plate.addEventListener('load',function(){rDirty=true;fit();});fit();}
applyBalance();paint();
})();
</script>
