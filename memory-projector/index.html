<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Projector</title>
  <meta name="description" content="A personal holographic projector of memories: switch it on, step through the moments, read the story on the table.">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./memory-projector.js?v=3"></script>
  <style>
    :root { --bg: #e4e4e2; --ink: #1a1a1a; --mute: rgba(26,26,26,.5); --beam: rgb(28, 46, 255); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    /* the projector on its desk, the whole window; placed a little left so the memory has the sky */
    memory-projector { position: fixed; inset: 0; width: 100%; height: 100%; min-height: 0; font-family: inherit;
      --stage-x: .5; --stage-y: .6; --stage-scale: .17; }
    @media (min-aspect-ratio: 16/10) { memory-projector { --stage-x: .42; } }
    memory-projector:focus-visible { outline: 2px solid var(--ink); outline-offset: -8px; border-radius: 16px; }
    body > header, body > footer { position: fixed; left: 32px; right: 32px; pointer-events: none; z-index: 1;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
    body > header { top: 28px; }
    body > header h1 { margin: 0; font-size: 11px; font-weight: 500; color: var(--ink); }
    body > footer { bottom: 28px; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
    ol { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
    ol li span { color: var(--ink); margin-right: 8px; font-variant-numeric: tabular-nums; }
    kbd { font: inherit; }
    .readout { text-align: right; }
    .readout b { display: block; font-weight: 400; font-size: 22px; letter-spacing: .01em; line-height: 1.2;
      color: var(--ink); margin-top: 6px; text-transform: none; }
    .readout b.on { color: var(--beam); }
    @media (max-width: 640px) {
      body > header, body > footer { left: 16px; right: 16px; }
      body > footer { flex-direction: column; align-items: start; }
      ol { flex-direction: column; gap: 8px; }
      .readout { text-align: left; }
    }
  </style>
</head>
<body>
  <header><h1>Memory Projector</h1></header>
  <memory-projector table movable power="off" memories="./memories/memories.json"></memory-projector>
  <footer>
    <ol>
      <li><span>01</span>The switch, or <kbd>P</kbd>, for power</li>
      <li><span>02</span>Arrows step back and forward</li>
      <li><span>03</span>The orange key shuffles</li>
    </ol>
    <div class="readout" aria-hidden="true">Memory <b id="readout">Off</b></div>
  </footer>
  <script>
    const out = document.getElementById('readout');
    const el = document.querySelector('memory-projector');
    let title = '';
    const show = () => {
      out.textContent = el.state && el.state.power ? (title || 'Untitled') : 'Off';
      out.classList.toggle('on', !!(el.state && el.state.power));
    };
    el.addEventListener('memorychange', (e) => { title = e.detail.title; show(); });
    el.addEventListener('powerchange', show);
    // the scene lab: ?lab in the URL, or Shift+L (it loads the first time; after that it toggles itself)
    let lab = false;
    const openLab = () => { if (lab) return; lab = true; import('./lab.js').catch((e) => { lab = false; console.error(e); }); };
    customElements.whenDefined('memory-projector').then(() => {
      const ready = () => { if (/[?&]lab\b/.test(location.search)) openLab(); };
      el.hasAttribute('data-ready') ? ready() : new MutationObserver((_, o) => { if (el.hasAttribute('data-ready')) { o.disconnect(); ready(); } })
        .observe(el, { attributes: true, attributeFilter: ['data-ready'] });
    });
    addEventListener('keydown', (e) => { if (e.shiftKey && e.key.toLowerCase() === 'l' && !e.metaKey && !e.ctrlKey && !lab) openLab(); });
    // the keys work anywhere on the page, not only when the projector has focus
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || document.activeElement === el || !el.togglePower) return;
      if (e.shiftKey) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      const act = { p: 'togglePower', ArrowRight: 'next', ArrowLeft: 'back', s: 'shuffle', Enter: 'shuffle' }[k];
      if (!act) return;
      e.preventDefault();
      el[act]();
    });
  </script>
</body>
</html>
