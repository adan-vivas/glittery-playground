<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Projector · table view (test fixture)</title>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
  <script type="module" src="../../memory-projector.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #e4e4e2; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    /* placed like the homepage places the Temporal Projector */
    memory-projector { position: fixed; inset: 0; width: 100%; height: 100%; min-height: 0; font-family: inherit; }
    @media (min-aspect-ratio: 16/10) { memory-projector { --stage-x: .35; } }
  </style>
</head>
<body>
  <memory-projector table movable power="off" memories="../../demo/memories.json"></memory-projector>
</body>
</html>
